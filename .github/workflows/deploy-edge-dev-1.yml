name: Deploy edge-dev-1

# Every green Full CI on master ships the bot it verified, with the Core login
# host of Core's latest green master, to edge-dev-1. Owner decision: the bot
# deploys automatically when a change merges.
on:
  workflow_run:
    workflows: [Full CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-edge-dev-1
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: edge-dev-1
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST_ED25519_PUBKEY: ${{ vars.SSH_HOST_ED25519_PUBKEY }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Fetch the verified bot and Core login host
        env:
          GH_TOKEN: ${{ github.token }}
          BOT_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          stage="$RUNNER_TEMP/telegram-runtime"
          install -d -m 0700 "$stage"
          # The bot from this Full CI run, or from the latest green master run.
          if [[ -z "$BOT_RUN" ]]; then
            BOT_RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/full-ci.yml/runs?branch=master&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          # The login host from Core's latest green master build.
          core_run=$(gh api "repos/nilx-one/core/actions/workflows/rust.yml/runs?branch=master&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fetch() {
            local repository=$1 run=$2 prefix=$3 binary=$4 id
            id=$(gh api "repos/$repository/actions/runs/$run/artifacts" \
              --jq "[.artifacts[] | select(.name | startswith(\"$prefix\")) | select(.expired | not)][0].id")
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "::error::No $prefix artifact in $repository run $run."; exit 1; }
            gh api "repos/$repository/actions/artifacts/$id/zip" > "$stage/$binary.zip"
            test "$(unzip -Z1 "$stage/$binary.zip")" = "$binary"
            unzip -p "$stage/$binary.zip" "$binary" > "$stage/$binary"
            test -s "$stage/$binary"
            rm "$stage/$binary.zip"
            printf '%s: %s run %s\n' "$binary" "$repository" "$run" >> "$GITHUB_STEP_SUMMARY"
          }
          fetch "$GITHUB_REPOSITORY" "$BOT_RUN" nilx-one-bot- nilx-one-bot
          fetch nilx-one/core "$core_run" core-telegram-login-host- nilxone-telegram-login-host
          cd "$stage"
          sha256sum nilxone-telegram-login-host nilx-one-bot > SHA256SUMS
          tar -cf bundle.tar nilxone-telegram-login-host nilx-one-bot SHA256SUMS

      - name: Validate pinned target and prepare SSH
        run: |
          set -Eeuo pipefail
          test "$SSH_HOST" = 158.220.74.54
          test "$SSH_USER" = deploy
          test -n "$SSH_PRIVATE_KEY"
          [[ "$SSH_HOST_ED25519_PUBKEY" =~ ^ssh-ed25519[[:space:]][A-Za-z0-9+/=]+$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          dir="$RUNNER_TEMP/ssh"
          install -d -m 0700 "$dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$dir/id_ed25519"
          chmod 600 "$dir/id_ed25519"
          ssh-keygen -y -P '' -f "$dir/id_ed25519" >/dev/null
          if [[ "$SSH_PORT" == 22 ]]; then label="$SSH_HOST"; else label="[$SSH_HOST]:$SSH_PORT"; fi
          printf '%s %s\n' "$label" "$SSH_HOST_ED25519_PUBKEY" > "$dir/known_hosts"
          chmod 600 "$dir/known_hosts"

      - name: Stage the release on edge-dev-1
        run: |
          set -Eeuo pipefail
          dir="$RUNNER_TEMP/ssh"
          release=$(sha256sum "$RUNNER_TEMP/telegram-runtime/SHA256SUMS" | cut -d ' ' -f 1)
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=10 \
            -i "$dir/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
              set -eu
              test \"\$(hostname)\" = edge-dev-1
              umask 077
              root=\"\$HOME/.local/share/aiaiaiai-infra/telegram-runtime\"
              install -d -m 0700 \"\$root\"
              staging=\"\$(mktemp -d \"\$root/.stage.XXXXXXXX\")\"
              trap 'rm -rf -- \"\$staging\"' EXIT
              tar -xf - -C \"\$staging\" -- nilxone-telegram-login-host nilx-one-bot SHA256SUMS
              cd \"\$staging\"
              sha256sum -c --quiet SHA256SUMS
              chmod 0755 nilxone-telegram-login-host nilx-one-bot
              if [ -d \"\$root/$release\" ]; then
                (cd \"\$root/$release\" && sha256sum -c --quiet \"\$staging/SHA256SUMS\")
              else
                mv -T \"\$staging\" \"\$root/$release\"
              fi
              echo \"Staged \$root/$release\"
            " < "$RUNNER_TEMP/telegram-runtime/bundle.tar"

      - name: Replace the login host and bot
        run: |
          set -Eeuo pipefail
          dir="$RUNNER_TEMP/ssh"
          ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$dir/known_hosts" -o ConnectTimeout=10 \
            -i "$dir/id_ed25519" -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "bash -s -- \"\$HOME/.local/share/aiaiaiai-infra/telegram-runtime/$RELEASE\"" \
            < deploy/edge-dev-1/upgrade.sh

      - name: Remove ephemeral SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/ssh"
