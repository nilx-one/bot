name: Package 0x1 Telegram credential

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  envelope:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: development
      deployment: false
    steps:
      - name: Install age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends age

      - name: Seal the bot token to edge-dev-1
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RECIPIENT: ${{ vars.EDGE_DEV_1_IDENTITY_AGE_RECIPIENT }}
        run: |
          set -Eeuo pipefail
          umask 077
          [[ "$TELEGRAM_BOT_TOKEN" =~ ^[0-9]+:[A-Za-z0-9_-]+$ ]] || {
            echo '::error::Check TELEGRAM_BOT_TOKEN in the bot development environment.'; exit 1;
          }
          [[ "$RECIPIENT" =~ ^age1[ac-hj-np-z02-9]{50,70}$ ]] || {
            echo '::error::Set EDGE_DEV_1_IDENTITY_AGE_RECIPIENT to the public recipient for edge-dev-1.'; exit 1;
          }
          printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN" | \
            age --recipient "$RECIPIENT" --output "$RUNNER_TEMP/telegram-credential.age"

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-credential-edge-dev-1
          path: ${{ runner.temp }}/telegram-credential.age
          retention-days: 1
          if-no-files-found: error

      - name: Show Infra input
        run: printf 'Use `%s` as `credential_run_id` in Activate 0x1 Telegram runtime.\n' "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
