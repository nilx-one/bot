name: Full CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  # Only a master push uses these: it attests the bot binary it verified, so
  # aiaiaiai-org/infra can deliver it without holding any credential here.
  id-token: write
  attestations: write

concurrency:
  group: bot-full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --all-targets
      - name: Prepare static Linux toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup target add x86_64-unknown-linux-musl
      - name: Validate static Telegram bot package
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl
          bot=target/x86_64-unknown-linux-musl/release/nilx-one-bot
          if env -u TELEGRAM_BOT_TOKEN "$bot" --check >telegram-bot-check.log 2>&1; then
            echo "Telegram bot preflight accepted an absent token"
            exit 1
          fi
          grep -F 'TELEGRAM_BOT_TOKEN is required' telegram-bot-check.log
      - name: Attest the verified Telegram bot package
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/x86_64-unknown-linux-musl/release/nilx-one-bot
      - name: Preserve verified Telegram bot package
        uses: actions/upload-artifact@v4
        with:
          name: nilx-one-bot-${{ github.sha }}
          path: target/x86_64-unknown-linux-musl/release/nilx-one-bot
          if-no-files-found: error
          retention-days: 30
