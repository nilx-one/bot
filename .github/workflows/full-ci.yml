name: Full CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bot-full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust format, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      # Temporary delivery step: expose Cargo.lock in CI as base64 so the
      # lockfile may be committed without floating host dependency resolution.
      # Cargo.lock contains only public package names, versions and checksums.
      - name: Export Cargo.lock for bootstrap
        run: |
          printf 'BOT_CARGO_LOCK_BEGIN\n'
          base64 -w 0 Cargo.lock
          printf '\nBOT_CARGO_LOCK_END\n'
