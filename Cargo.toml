[package]
name = "nilx-one-bot"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"
repository = "https://github.com/nilx-one/bot"
description = "Messenger adapters for the 0x1 product; Core owns gameplay and identity authorization"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

